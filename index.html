<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typefeel · Feel a typeface before you commit to it</title>
<meta name="description" content="A typography playground. Set your own words in 16 typefaces, tune size, weight, spacing and leading, see it as a headline, a specimen or a waterfall, and get an AI read on its mood and pairings.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Bebas+Neue&family=Unbounded:wght@200..900&family=Syne:wght@400..800&family=Righteous&family=Permanent+Marker&family=Architects+Daughter&family=Space+Grotesk:wght@300..700&family=Outfit:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Josefin+Sans:wght@100..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f0;--card:#fff;--ink:#141414;--muted:#6a6862;--line:#e3e1db;--soft:#eeece7;--accent:#141414;--hl:#ffd84d;--mono:'JetBrains Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--card:#171717;--ink:#efeee9;--muted:#9c9a93;--line:#2a2a2a;--soft:#1f1f1f;--accent:#efeee9}}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:14px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,textarea,input,select{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:italic 700 1.35rem/1 'Playfair Display',serif;letter-spacing:-.02em}
.brand span{font-size:.78rem;color:var(--muted)}
.h-r{display:flex;gap:10px;align-items:center}
.h-r a{font-size:.78rem;color:var(--muted);text-decoration:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-weight:600;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.done{background:#15803d;border-color:#15803d;color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.app{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;height:calc(100vh - 61px);min-height:620px}
.side{border-right:1px solid var(--line);background:var(--card);overflow-y:auto;padding:16px}
.right{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:18px}
.lbl{display:flex;justify-content:space-between;align-items:center;font:500 .68rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px}
.lbl:first-child{margin-top:0}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.filters button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:.72rem;color:var(--muted)}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fonts{display:grid;gap:2px}
.fonts button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;border-radius:9px;padding:7px 10px;font-size:1.02rem;line-height:1.2}
.fonts button small{font:500 .62rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:none}
.fonts button:hover{background:var(--soft)}
.fonts button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.fonts button[aria-pressed=true] small{color:inherit;opacity:.6}
.sl{margin-bottom:12px}
.sl div{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px}
.sl output{font:500 .74rem var(--mono);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--ink);height:18px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;border-radius:7px;padding:6px 2px;font-size:.76rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(128,128,128,.35);padding:0}
.sw button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
/* stage */
.main{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.presets button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:.78rem;white-space:nowrap}
.presets button:hover{border-color:var(--ink)}
.stage{flex:1;overflow:auto;padding:clamp(24px,5vw,64px);transition:background .25s,color .25s;display:flex;flex-direction:column;justify-content:center}
.stage textarea{width:100%;border:0;background:none;resize:none;outline:none;overflow:hidden;color:inherit;padding:0;display:block}
.stage textarea::selection{background:var(--hl);color:#111}
.spec{display:grid;gap:28px;max-width:900px}
.spec .meta{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.1em;opacity:.55}
.spec .body{font-family:Inter;font-size:17px;line-height:1.65;max-width:60ch;opacity:.85}
.spec .glyphs{font-size:42px;line-height:1.25;word-break:break-all;opacity:.9}
.wf{display:grid;gap:10px}
.wf div{display:flex;align-items:baseline;gap:16px;white-space:nowrap;overflow:hidden}
.wf small{font:500 .68rem var(--mono);opacity:.5;width:44px;flex:none}
.hint{font:500 .7rem var(--mono);color:var(--muted);padding:8px 16px;border-top:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* analysis */
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);font-size:.86rem}
.empty b{display:block;color:var(--ink);font-size:.95rem;margin-bottom:6px}
.empty .btn{margin-top:14px}
.mood{font:italic 600 1.7rem/1.15 'Playfair Display',serif;letter-spacing:-.02em;margin:4px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tags span{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:.74rem}
.uses{list-style:none;padding:0;display:grid;gap:8px}
.uses li{font-size:.85rem;padding-left:16px;position:relative}.uses li::before{content:'→';position:absolute;left:0;color:var(--muted)}
.pair{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;text-align:left;width:100%;background:none}
.pair:hover,.pair[aria-pressed=true]{border-color:var(--ink)}
.pair b{display:block;font-size:1.25rem;font-weight:500;line-height:1.2}
.pair small{font:500 .66rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pair p{font-size:.82rem;color:var(--muted);margin-top:4px}
.avoid{font-size:.85rem;background:var(--soft);border-radius:12px;padding:12px}
pre{font:400 .74rem/1.6 var(--mono);background:var(--soft);border-radius:12px;padding:12px;overflow-x:auto;white-space:pre}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sh 1.3s linear infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.err{color:#c2410c;font-size:.84rem;margin-top:10px}
@media (max-width:1180px){.app{grid-template-columns:250px minmax(0,1fr)}.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.app{height:auto}.main{height:calc(100vh - 61px);min-height:560px}.side{max-height:calc(100vh - 61px)}}
@media (max-width:760px){
  header{padding:12px 16px}.brand span,.h-r a{display:none}
  .app{display:flex;flex-direction:column}
  .main{order:-1;height:auto;min-height:0}.stage{min-height:46vh;padding:28px 18px}
  .side{max-height:none;border-right:0;border-top:1px solid var(--line)}
  .fonts{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .fonts button{flex:none;border:1px solid var(--line);white-space:nowrap}
  .fonts button small{display:none}
  .hint span:last-child{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Typefeel</b><span>Feel a typeface before you commit to it</span></div>
  <div class="h-r"><a href="https://neeleshagrawal.vercel.app" target="_blank" rel="noopener">A Ship69 tool by Neelesh ↗</a><button class="btn" id="css">Copy CSS</button><button class="btn primary" id="analyse">Read the feel →</button></div>
</header>
<div class="app">
  <aside class="side" aria-label="Type controls">
    <div class="lbl">Typeface <span id="font-count"></span></div>
    <div class="filters" id="filters"></div>
    <div class="fonts" id="fonts"></div>

    <div class="lbl">Settings <button class="btn" id="reset" style="padding:3px 8px;font-size:.68rem">Reset</button></div>
    <div id="sliders"></div>

    <div class="lbl">Align</div>
    <div class="seg three" id="align"><button data-v="left" aria-pressed="true">Left</button><button data-v="center" aria-pressed="false">Center</button><button data-v="right" aria-pressed="false">Right</button></div>
    <div class="lbl">Canvas</div>
    <div class="seg" id="bg"></div>
    <div class="lbl">Ink</div>
    <div class="sw" id="ink"></div>
  </aside>

  <section class="main" aria-label="Preview">
    <div class="bar">
      <div class="seg three" id="view" style="width:260px"><button data-v="headline" aria-pressed="true">Headline</button><button data-v="specimen" aria-pressed="false">Specimen</button><button data-v="waterfall" aria-pressed="false">Waterfall</button></div>
      <div class="presets" id="presets" aria-label="Presets"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="hint"><span id="specline"></span><span>Click the text to edit it</span></div>
  </section>

  <aside class="right" aria-label="Analysis" aria-live="polite">
    <div id="a-out"><div class="empty"><b>What does this type say?</b>Get a read on the mood of your setting, where it works, what to pair it with, and where it fails.<br><button class="btn primary" id="analyse2">Read the feel →</button></div></div>
  </aside>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const FONTS = [
  ['Playfair Display', 'serif'], ['Cormorant Garamond', 'serif'], ['Fraunces', 'serif'], ['Libre Baskerville', 'serif'], ['DM Serif Display', 'serif'],
  ['Bebas Neue', 'display'], ['Unbounded', 'display'], ['Syne', 'display'], ['Righteous', 'display'],
  ['Permanent Marker', 'hand'], ['Architects Daughter', 'hand'],
  ['Space Grotesk', 'sans'], ['Outfit', 'sans'], ['Raleway', 'sans'], ['Josefin Sans', 'sans'], ['Inter', 'sans'],
];
const SLIDERS = [
  ['size', 'Size', 24, 200, 1, v => v + 'px'], ['weight', 'Weight', 100, 900, 100, v => v],
  ['tracking', 'Letter spacing', -10, 30, 1, v => (v / 100).toFixed(2) + 'em'], ['leading', 'Line height', 8, 25, 1, v => (v / 10).toFixed(1)],
  ['skew', 'Slant', -20, 20, 1, v => v + '°'], ['opacity', 'Opacity', 10, 100, 1, v => v + '%'],
];
const BGS = { paper: ['#f5f4ef', '#141414'], cream: ['#efe7d6', '#2a1f14'], ink: ['#121212', '#efeee9'], black: ['#000', '#fff'] };
const INKS = ['#141414', '#efeee9', '#2a1f14', '#b4532a', '#1d4ed8', '#047857', '#7c3aed', '#e11d48'];
const DEF = { font: 'Playfair Display', size: 96, weight: 400, tracking: -2, leading: 11, skew: 0, opacity: 100, align: 'left', bg: 'paper', ink: null, view: 'headline', text: 'Quiet confidence, set in type.', pair: null };
const PRESETS = {
  Display: { font: 'Bebas Neue', size: 150, weight: 400, tracking: 4, leading: 9, skew: 0 },
  Editorial: { font: 'Cormorant Garamond', size: 92, weight: 300, tracking: 0, leading: 10, skew: 0 },
  Minimal: { font: 'Space Grotesk', size: 64, weight: 300, tracking: 6, leading: 12, skew: 0 },
  Loud: { font: 'Unbounded', size: 104, weight: 800, tracking: -4, leading: 9, skew: -4 },
  Elegant: { font: 'Playfair Display', size: 84, weight: 400, tracking: 2, leading: 11, skew: 0 },
  Friendly: { font: 'Outfit', size: 88, weight: 600, tracking: -2, leading: 10, skew: 0 },
};
let S = { ...DEF }, filter = 'all', last = null;
try { Object.assign(S, JSON.parse(localStorage.getItem('typefeel') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('typefeel', JSON.stringify(S)); } catch {} };

// controls
$('#filters').innerHTML = [['all', 'All'], ['serif', 'Serif'], ['sans', 'Sans'], ['display', 'Display'], ['hand', 'Hand']].map(([k, l]) => `<button data-f="${k}" aria-pressed="${k === filter}">${l}</button>`).join('');
const renderFonts = () => {
  const list = FONTS.filter(f => filter === 'all' || f[1] === filter);
  $('#fonts').innerHTML = list.map(([n, c]) => `<button data-n="${n}" style="font-family:'${n}'" aria-pressed="${n === S.font}">${n}<small>${c}</small></button>`).join('');
  $('#font-count').textContent = list.length;
};
$('#filters').onclick = e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; $('#filters').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderFonts(); };
$('#fonts').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.font = b.dataset.n; renderFonts(); apply(); };
$('#sliders').innerHTML = SLIDERS.map(([k, l, mn, mx, st]) => `<div class="sl"><div><label for="s-${k}">${l}</label><output id="o-${k}"></output></div><input type="range" id="s-${k}" data-k="${k}" min="${mn}" max="${mx}" step="${st}"></div>`).join('');
$('#sliders').oninput = e => { const k = e.target.dataset.k; if (k) { S[k] = +e.target.value; apply(); } };
$('#bg').innerHTML = Object.keys(BGS).map(k => `<button data-v="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('');
$('#ink').innerHTML = INKS.map(c => `<button data-v="${c}" style="background:${c}" aria-label="Ink ${c}"></button>`).join('');
const seg = (id, key) => $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; S[key] = b.dataset.v; if (key === 'bg') S.ink = null; if (key === 'view') build(); apply(); };
seg('#align', 'align'); seg('#bg', 'bg'); seg('#ink', 'ink'); seg('#view', 'view');
$('#presets').innerHTML = Object.keys(PRESETS).map(k => `<button data-p="${k}">${k}</button>`).join('');
$('#presets').onclick = e => { const b = e.target.closest('button'); if (!b) return; Object.assign(S, PRESETS[b.dataset.p]); renderFonts(); apply(); };
$('#reset').onclick = () => { S = { ...DEF, text: S.text }; build(); renderFonts(); apply(); };

// stage
function build() {
  const v = S.view, st = $('#stage');
  if (v === 'headline') st.innerHTML = `<textarea id="txt" rows="1" spellcheck="false" aria-label="Your text">${esc(S.text)}</textarea>`;
  else if (v === 'specimen') st.innerHTML = `<div class="spec"><div class="meta" id="sp-meta"></div><textarea id="txt" rows="1" spellcheck="false" aria-label="Your text">${esc(S.text)}</textarea><p class="body" id="sp-body">Good typography is invisible until it isn't. This paragraph shows how your headline sits above running text, so you can judge contrast, rhythm and whether the pair feels like one voice.</p><div class="glyphs" id="sp-g">Aa Bb Cc Gg Qq Rr 0123 &amp;?!</div></div>`;
  else st.innerHTML = `<div class="wf" id="wf"></div>`;
  const t = $('#txt'); if (t) t.addEventListener('input', () => { S.text = t.value; fit(t); save(); });
}
const fit = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
function apply() {
  const [bg, defInk] = BGS[S.bg], ink = S.ink || defInk;
  SLIDERS.forEach(([k, , , , , f]) => { $('#s-' + k).value = S[k]; $('#o-' + k).textContent = f(S[k]); });
  ['#align', '#bg', '#ink', '#view'].forEach((id, i) => $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === [S.align, S.bg, ink, S.view][i])));
  const st = $('#stage'); st.style.background = bg; st.style.color = ink;
  const type = { fontFamily: `'${S.font}'`, fontWeight: S.weight, letterSpacing: S.tracking / 100 + 'em', lineHeight: S.leading / 10, transform: `skewX(${-S.skew}deg)`, opacity: S.opacity / 100, textAlign: S.align };
  const t = $('#txt');
  if (t) { Object.assign(t.style, type, { fontSize: `min(${S.view === 'specimen' ? Math.min(S.size, 110) : S.size}px, ${S.text.length > 14 ? 14 : 20}vw)` }); fit(t); }
  if (S.view === 'specimen') {
    $('#sp-meta').textContent = `${S.font} · ${S.weight} · ${S.size}px` + (S.pair ? ` / body in ${S.pair}` : ' / body in Inter');
    $('#sp-body').style.fontFamily = `'${S.pair || 'Inter'}'`; $('#sp-body').style.textAlign = S.align;
    Object.assign($('#sp-g').style, { fontFamily: type.fontFamily, fontWeight: S.weight, textAlign: S.align });
  }
  if (S.view === 'waterfall') $('#wf').innerHTML = [120, 88, 64, 48, 32, 24, 16].map(px => `<div style="justify-content:${S.align === 'center' ? 'center' : S.align === 'right' ? 'flex-end' : 'flex-start'}"><small>${px}px</small><span style="font-family:'${S.font}';font-weight:${S.weight};font-size:${px}px;letter-spacing:${S.tracking / 100}em;line-height:1.1">${esc(S.text)}</span></div>`).join('');
  $('#specline').textContent = `${S.font} · ${S.size}px / ${(S.leading / 10).toFixed(1)} · ${S.weight} · ${(S.tracking / 100).toFixed(2)}em`;
  save();
}
const css = () => `font-family: '${S.font}', ${(FONTS.find(f => f[0] === S.font) || [])[1] === 'serif' ? 'serif' : 'sans-serif'};\nfont-size: ${S.size}px;\nfont-weight: ${S.weight};\nline-height: ${(S.leading / 10).toFixed(2)};\nletter-spacing: ${(S.tracking / 100).toFixed(2)}em;${S.skew ? `\nfont-style: oblique ${S.skew}deg;` : ''}`;
$('#css').onclick = () => navigator.clipboard.writeText(css()).then(() => { const b = $('#css'); b.textContent = 'Copied ✓'; b.classList.add('done'); setTimeout(() => { b.textContent = 'Copy CSS'; b.classList.remove('done'); }, 1400); });

// pairing fonts load on demand
const loaded = new Set(FONTS.map(f => f[0]));
const loadFont = n => { if (loaded.has(n)) return; loaded.add(n); const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(n).replace(/%20/g, '+')}:wght@400;500;700&display=swap`; document.head.appendChild(l); };

async function analyse() {
  const out = $('#a-out'); $('#analyse').disabled = true;
  out.innerHTML = `<div class="lbl">Reading the feel…</div><div class="skel" style="height:30px;width:70%"></div><div class="skel"></div><div class="skel" style="width:85%"></div><div class="skel" style="height:60px;margin-top:20px"></div><div class="skel" style="height:60px"></div>`;
  if (innerWidth < 1180) out.scrollIntoView({ behavior: 'smooth' });
  const prompt = `You are a typography expert and creative director. Analyse this type setting: its feel, mood and use cases.

Type settings:
- Font: ${S.font}
- Size: ${S.size}px
- Weight: ${S.weight}
- Letter spacing: ${(S.tracking / 100).toFixed(2)}em
- Line height: ${(S.leading / 10).toFixed(1)}
- Slant: ${S.skew}°
- Text: "${S.text.slice(0, 200)}"
- Background: ${BGS[S.bg][0]}, ink: ${S.ink || BGS[S.bg][1]}

Output ONLY a JSON object, no markdown, no preamble:
{"mood":"2-4 word mood label","moodText":"Two sentences on the feeling this setting creates.","moodTags":["tag1","tag2","tag3","tag4"],"bestFor":["Specific use case, one sentence","...","..."],"pairings":[{"font":"Google Fonts family name","role":"Body / Display / Caption","why":"One short sentence"},{"font":"...","role":"...","why":"..."}],"avoid":"One or two sentences on what this setting is wrong for and why.","tweak":"One concrete adjustment to the current settings that would improve it, with numbers."}`;
  try {
    const r = await fetch('/api/typefeel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 429 ? 'Too many requests right now. Try again in a minute.' : 'The read could not be completed. Try again.');
    const m = (d.content || '').replace(/```json|```/g, '').match(/\{[\s\S]*\}/);
    if (!m) throw new Error('The response came back malformed. Try again.');
    last = JSON.parse(m[0]);
    (last.pairings || []).forEach(p => loadFont(p.font));
    out.innerHTML = `<div class="lbl" style="margin-top:0">Mood</div><div class="mood">${esc(last.mood)}</div><p style="font-size:.88rem">${esc(last.moodText)}</p><div class="tags">${(last.moodTags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <div class="lbl">Works for</div><ul class="uses">${(last.bestFor || []).map(u => `<li>${esc(u)}</li>`).join('')}</ul>
      <div class="lbl">Pair with <span>tap to preview</span></div>${(last.pairings || []).map(p => `<button class="pair" data-f="${esc(p.font)}" aria-pressed="${S.pair === p.font}"><small>${esc(p.role)}</small><b style="font-family:'${esc(p.font)}'">${esc(p.font)}</b><p>${esc(p.why || '')}</p></button>`).join('')}
      ${last.tweak ? `<div class="lbl">Try this</div><p class="avoid" style="background:none;border:1px solid var(--line)">${esc(last.tweak)}</p>` : ''}
      <div class="lbl">Avoid for</div><p class="avoid">${esc(last.avoid)}</p>
      <div class="lbl">CSS</div><pre>${esc(css())}</pre>`;
  } catch (e) { out.innerHTML = `<div class="empty"><b>Could not read the feel</b>${esc(e.message)}<br><button class="btn primary" id="retry">Try again</button></div>`; $('#retry').onclick = analyse; }
  finally { $('#analyse').disabled = false; }
}
$('#a-out').addEventListener('click', e => {
  const p = e.target.closest('.pair'); if (!p) return;
  S.pair = S.pair === p.dataset.f ? null : p.dataset.f;
  document.querySelectorAll('.pair').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === S.pair));
  if (S.view !== 'specimen') { S.view = 'specimen'; build(); }
  apply();
});
$('#analyse').onclick = analyse; $('#analyse2').onclick = analyse;
renderFonts(); build(); apply();
document.fonts?.ready.then(() => { const t = $('#txt'); if (t) fit(t); });
</script>
</body>
</html>
